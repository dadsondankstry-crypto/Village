<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1b22">
<link rel="manifest" href="manifest.json">
<title>Heróis da Vila V 1.25</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:6px;left:6px;max-width:calc(100% - 190px);display:flex;gap:5px;flex-wrap:wrap;pointer-events:none;font-size:12px;z-index:10}
.stat{background:rgba(0,0,0,.6);padding:4px 9px;border-radius:9px;white-space:nowrap;border:1px solid rgba(255,255,255,.12);font-size:12px}
#topright{position:fixed;top:6px;right:6px;display:flex;gap:5px;z-index:11}
.iconbtn{width:40px;height:40px;border-radius:11px;background:rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:active{background:rgba(255,255,255,.22)}

#minimap-container{position:fixed;top:60px;left:6px;width:120px;height:120px;background:rgba(0,0,0,.7);border:2px solid #555;border-radius:8px;z-index:20;overflow:hidden;display:none;pointer-events:none;transition:width 0.2s, height 0.2s;}
#minimap-container.on{display:block}
#minimap-canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#coords{position:fixed;bottom:10px;left:10px;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:6px;font-size:11px;color:#8fd;z-index:10;display:none;pointer-events:none}
#coords.on{display:block}

#combat{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4, 1fr);gap:6px;z-index:12;opacity:.65;transition:opacity .2s;width:270px;justify-items:center}
#combat.on{opacity:1}
.cbtn{width:58px;height:58px;border-radius:50%;background:rgba(22,22,30,.92);border:2px solid rgba(255,255,255,.28);color:#fff;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;cursor:pointer;position:relative}
.cbtn small{font-size:9px;opacity:.75;margin-top:2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.cbtn:active{background:rgba(80,80,120,.95)}
.cbtn.cd{opacity:.35}
.cd-txt{position:absolute;top:-5px;right:-5px;background:#e74c3c;color:#fff;font-size:10px;font-weight:bold;padding:2px 5px;border-radius:10px;border:1px solid #fff}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:60;padding:10px}
#overlay.hidden{display:none}
#ovBox{background:#1b1b22;border:1px solid #333;border-radius:14px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:14px}
#ovBox h2{font-size:17px;margin-bottom:10px;color:#ffd54f}
#ovBox h3{font-size:14px;margin:12px 0 6px;color:#8fd}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 6px;border-bottom:1px solid #2a2a33;font-size:13.5px}
.row:active{background:#25252f}
.btn{background:#2e7d32;border:none;color:#fff;padding:8px 13px;border-radius:8px;font-size:13px;cursor:pointer}
.btn.red{background:#a93226}
.btn.blue{background:#2266a8}
.btn.gray{background:#444}
.btn:active{filter:brightness(1.3)}
#nomeIn, #jsonIn{width:100%;padding:11px;border-radius:9px;border:1px solid #444;background:#101017;color:#fff;font-size:14px;margin-bottom:10px;font-family:monospace}
#jsonIn{height:120px;resize:none}
.file-input{width:100%;padding:10px;background:#2a2a33;border:1px solid #444;border-radius:8px;color:#fff;margin-bottom:10px}
.cls{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid #333;border-radius:10px;margin-bottom:8px;cursor:pointer}
.cls:active{background:#25252f}
.cls .em{font-size:26px}
.cls b{font-size:14px}
.cls p{font-size:11px;opacity:.65;margin-top:2px}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;z-index:40;pointer-events:none;align-items:center}
.tst{background:rgba(0,0,0,.85);padding:7px 15px;border-radius:20px;font-size:13px;border:1px solid rgba(255,255,255,.2);animation:tstA 2.6s forwards}
@keyframes tstA{0%{opacity:0;transform:translateY(-8px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#err{position:fixed;top:0;left:0;right:0;background:#8b0000;color:#fff;font-size:11px;padding:5px 9px;z-index:999;display:none;word-break:break-all}
@media (orientation:landscape) and (max-height:560px){
  #combat{left:auto;right:8px;bottom:50%;transform:translateY(50%);width:240px;}
  .cbtn{width:50px;height:50px;font-size:17px}
  #hud{font-size:11px;max-width:calc(100% - 260px)}
  #topright{top:5px;right:5px}
  .iconbtn{width:36px;height:36px;font-size:17px}
  #minimap-container{width:90px;height:90px;top:50px;}
}
</style>
</head>
<body>
<div id="err"></div>
<canvas id="game"></canvas>
<div id="hud">
  <div class="stat" id="sNome">—</div>
  <div class="stat" id="sHp">❤️ 0/0</div>
  <div class="stat" id="sMp">💧 0/0</div>
  <div class="stat" id="sOuro">💰 0</div>

</div>

<div id="minimap-container"><canvas id="minimap-canvas" width="120" height="120"></canvas></div>
<div id="coords">X: 0 | Y: 0</div>

<div id="topright">
  <div class="iconbtn" onclick="abrirStatus()">📊</div>
  <div class="iconbtn" onclick="abrirInventario()">🎒</div>
  <div class="iconbtn" onclick="abrirMenu()">☰</div>
  <div class="iconbtn" onclick="toggleFull()">⛶</div>
</div>
<div id="combat">
  <div class="cbtn" id="skBtn0" onclick="usarSkill(0)">✨<small id="skN0">—</small></div>
  <div class="cbtn" id="skBtn1" onclick="usarSkill(1)">✨<small id="skN1">—</small></div>
  <div class="cbtn" id="skBtn2" onclick="usarSkill(2)">✨<small id="skN2">—</small></div>
  <div class="cbtn" id="skBtn3" onclick="usarSkill(3)">✨<small id="skN3">—</small></div>
  <div class="cbtn" onclick="usarPocaoVida()">❤️<small>Vida</small></div>
  <div class="cbtn" onclick="usarPocaoMana()">💧<small>Mana</small></div>
  <div class="cbtn" onclick="coletar()">🧺<small>Coletar</small></div>
  <div class="cbtn" onclick="atacar()">⚔️<small>Atacar</small></div>
</div>
<div id="toast"></div>
<div id="overlay" class="hidden"><div id="ovBox"></div></div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('Falha no SW:', err));
  });
}

window.onerror = function(msg, src, ln, col){
  var e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = 'ERRO (' + ln + '): ' + msg;
};

/* ================= CANVAS ================= */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var minimapCanvas = document.getElementById('minimap-canvas');
var mmCtx = minimapCanvas.getContext('2d');
var W = 0, H = 0, DPR = 1;
var screenShake = 0, flashAlpha = 0;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 220); });

/* ================= DADOS BASE ================= */
var ITEMS = {
  espada_ferro:{n:'Espada de Ferro',e:'🗡️',t:'arma',slot:'arma',atk:6,preco:40,r:1},
  adaga:{n:'Adaga',e:'🔪',t:'arma',slot:'arma',atk:5,preco:30,r:1},
  cajado:{n:'Cajado',e:'🪄',t:'arma',slot:'arma',atk:8,preco:60,r:2},
  arco:{n:'Arco Curto',e:'🏹',t:'arma',slot:'arma',atk:7,preco:55,r:2},
  espada_aco:{n:'Espada de Aço',e:'⚔️',t:'arma',slot:'arma',atk:14,preco:160,r:3},
  escudo_madeira:{n:'Escudo de Madeira',e:'🛡️',t:'armadura',slot:'escudo',def:5,preco:45,r:1},
  armadura_couro:{n:'Armadura de Couro',e:'🥋',t:'armadura',slot:'armadura',def:7,preco:90,r:2},
  elmo_ferro:{n:'Elmo de Ferro',e:'⛑️',t:'armadura',slot:'elmo',def:4,preco:60,r:2},
  botas:{n:'Botas Leves',e:'👟',t:'armadura',slot:'botas',def:2,preco:50,r:1},
  anel:{n:'Anel de Prata',e:'💍',t:'armadura',slot:'acessorio',def:3,preco:120,r:3},
  pocao_vida:{n:'Poção de Vida',e:'❤️',t:'consumivel',cura:50,preco:25,r:1},
  pocao_mana:{n:'Poção de Mana',e:'💧',t:'consumivel',mana:40,preco:22,r:1},
  sucata:{n:'Sucata',e:'⚙️',t:'material',preco:6,r:1},
  dente:{n:'Dente de Goblin',e:'🦷',t:'material',preco:4,r:1},
  carne:{n:'Carne',e:'🥩',t:'material',preco:5,r:1},
  pele:{n:'Pele de Lobo',e:'🟫',t:'material',preco:8,r:1},
  osso:{n:'Osso',e:'🦴',t:'material',preco:7,r:1}
};

var CLASSES = {
  guerreiro:{n:'Guerreiro',e:'⚔️',cor:'#c0392b',hp:120,mp:50,atk:11,def:8,spd:172,eva:3,atkSpd:1.0,arma:'espada_ferro',
    d:'Muita vida e defesa.',
    skills:[{n:'Golpe Forte',custo:5,cd:6,mult:2.5},{n:'Grito Guerra',custo:8,cd:10,buffDef:6},{n:'Investida',custo:10,cd:8,mult:1.5,ignoraDef:true},{n:'Fúria',custo:15,cd:15,mult:3}]},
  mago:{n:'Mago',e:'🔮',cor:'#8e44ad',hp:85,mp:100,atk:7,def:4,spd:166,eva:5,atkSpd:0.9,arma:'cajado',
    d:'Magias poderosas.',
    skills:[{n:'Bola de Fogo',custo:8,cd:5,mult:1.8,bonus:8},{n:'Raio Gelo',custo:8,cd:6,mult:1.5,bonus:10,stun:2},{n:'Cura',custo:12,cd:10,cura:50},{n:'Meteoro',custo:20,cd:15,mult:3,visual:'meteoro'}]},
  arqueiro:{n:'Arqueiro',e:'🏹',cor:'#27ae60',hp:95,mp:55,atk:10,def:5,spd:186,eva:12,atkSpd:1.1,arma:'arco',
    d:'Ataque à distância.',
    skills:[{n:'Tiro Certeiro',custo:5,cd:5,mult:1.6},{n:'Tiro Duplo',custo:8,cd:6,mult:2,critChance:0.5},{n:'Tiro no Olho',custo:10,cd:10,mult:0.5,blind:5},{n:'Chuva Flechas',custo:15,cd:15,mult:3,visual:'chuva'}]},
  andarilho:{n:'Andarilho',e:'🗡️',cor:'#d68910',hp:105,mp:65,atk:10,def:6,spd:180,eva:8,atkSpd:1.0,arma:'adaga',
    d:'Misto.',
    skills:[{n:'Atq Duplo',custo:6,cd:6,mult:2},{n:'Adaga Ven.',custo:8,cd:8,mult:1.5,bonus:10},{n:'Esquiva Perf.',custo:10,cd:12,buffEva:3},{n:'Lâmina Vento',custo:15,cd:15,mult:3}]}
};

var WEAPON_CD = {adaga:0.6, espada_ferro:0.8, espada_aco:0.8, arco:1.0, cajado:1.1};

var MONSTERS = {
  goblin:{n:'Goblin',e:'👺',lvl:1,hp:34,atk:7,def:2,xp:12,ouro:9,spd:52,r:18,cor:'#7fae4a',visao:140,drops:[['sucata',0.6],['dente',0.5],['pocao_vida',0.15]]},
  lobo:{n:'Lobo',e:'🐺',lvl:2,hp:48,atk:10,def:3,xp:18,ouro:14,spd:82,r:19,cor:'#8a8a8a',visao:160,drops:[['carne',0.6],['pele',0.45]]},
  esqueleto:{n:'Esqueleto',e:'💀',lvl:3,hp:72,atk:13,def:6,xp:28,ouro:22,spd:50,r:20,cor:'#d8d8d8',visao:130,drops:[['osso',0.7],['sucata',0.4]]},
  orc:{n:'Orc',e:'👹',lvl:5,hp:115,atk:19,def:9,xp:45,ouro:38,spd:60,r:24,cor:'#6b9a5a',visao:180,drops:[['sucata',0.5],['espada_ferro',0.12],['pocao_vida',0.3]]}
};

var QUESTS = {
  "q_base_1": {id:"q_base_1", nome:"Primeiros Passos", desc:"Mate 5 goblins", tipo:"matar", alvo:"goblin", qtd:5, r_ouro:120, r_xp:60, tipo_missao:"unica"}
};

/* ================= MUNDO ================= */
var WORLD = {w:1600, h:2400};
var VILA = {x:100, y:1380, w:1400, h:940};
var PONTE = {x:690, y:1170, w:220, h:230};
var CAMPOS_Y = 1170;

var BUILDINGS = [
  {id:'ferreiro',  nome:'Ferreiro',   e:'🔨', x:170,  y:1440, w:170, h:130},
  {id:'banqueiro', nome:'Banco',      e:'🏦', x:715,  y:1440, w:170, h:130},
  {id:'armeiro',   nome:'Armeiro',    e:'⚔️', x:1260, y:1440, w:170, h:130},
  {id:'vendedora', nome:'Vendedora',  e:'🧪', x:170,  y:2150, w:170, h:130},
  {id:'anciao',    nome:'Ancião',     e:'📜', x:715,  y:2150, w:170, h:130},
  {id:'alquimista',nome:'Alquimista', e:'✨', x:1260, y:2150, w:170, h:130}
];

var TREES = [];
(function(){ for(var i=0;i<70;i++) TREES.push({x:40+Math.random()*1520, y:60+Math.random()*1030, r:16+Math.random()*10, c:'#2e5c28'}); })();
var FLOWERS = [];
(function(){ for(var i=0;i<40;i++) FLOWERS.push({x:VILA.x+30+Math.random()*(VILA.w-60), y:VILA.y+160+Math.random()*(VILA.h-200), c:['#e74c3c','#f1c40f','#ecf0f1','#9b59b6'][i%4]}); })();

/* ================= ESTADO ================= */
var SAVE_KEY = 'heroisDaVila_v19';
var SAVE = {chars:{}, current:null, ver:'1.25', world:{zones:[], customMonsters:{}}, config:{autoCollect:true, autoAttack:true, showPlayerHp:true, showMonsterHp:true, showMinimap:true, showCoords:true, minimapZoom:1}};
var G = null;
var currentId = null;
var monsters = [];
var ground = [];
var floats = [];
var cam = {x:0, y:0};
var combat = null;
var lastSave = 0;
var gameTime = 0;
var dlcZones = [];

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function toast(msg){
  var d = document.createElement('div');
  d.className = 'tst'; d.textContent = msg;
  document.getElementById('toast').appendChild(d);
  setTimeout(function(){ d.remove(); }, 2600);
}
function floatText(x,y,txt,cor){ floats.push({x:x, y:y, t:txt, c:cor||'#fff', life:0.9, vy:-38}); }

function carregar(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(raw){ var o = JSON.parse(raw); if(o && o.chars) SAVE = o; }
  }catch(e){ console.warn('save inválido', e); }
  if(!SAVE.config) SAVE.config = {autoCollect:true, autoAttack:true, showPlayerHp:true, showMonsterHp:true, showMinimap:true, showCoords:true, minimapZoom:1};
  if(!SAVE.world) SAVE.world = {zones:[], customMonsters:{}};
  atualizarVisibilidadeUI();
}
function persist(){
  if(!G || !currentId) return;
  SAVE.chars[currentId] = G;
  SAVE.current = currentId;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }catch(e){}
}

function atualizarVisibilidadeUI() {
  document.getElementById('minimap-container').classList.toggle('on', SAVE.config.showMinimap);
  document.getElementById('coords').classList.toggle('on', SAVE.config.showCoords);
  var mSize = 120 * (SAVE.config.minimapZoom || 1);
  document.getElementById('minimap-container').style.width = mSize + 'px';
  document.getElementById('minimap-container').style.height = mSize + 'px';
  document.getElementById('minimap-canvas').width = mSize;
  document.getElementById('minimap-canvas').height = mSize;
}

function updateSkillNames(){
  if(!G) return;
  var skills = CLASSES[G.classe].skills;
  for(var i=0; i<4; i++) document.getElementById('skN'+i).textContent = skills[i].n;
}

function novoChar(nome, classe){
  var c = CLASSES[classe];
  return {
    id: 'c' + Date.now() + Math.floor(Math.random()*999),
    nome: nome, classe: classe,
    x: 800, y: 1900, dir: -Math.PI/2,
    hp: c.hp, hpMax: c.hp, mp: c.mp, mpMax: c.mp,
    baseAtk: c.atk, baseDef: c.def, baseSpd: c.spd, baseEva: c.eva, baseAtkSpd: c.atkSpd,
    ouro: 50, xp: 0, level: 1, potCdV: 0, potCdM: 0, buffDef: 0, buffEva: 0,
    inv: [], equip: {arma:c.arma, armadura:null, elmo:null, escudo:null, acessorio:null, botas:null},
    banco: [], quests: {}, auto: null, criado: Date.now()
  };
}

function invAdd(itemId, q, up, ench){
  q = q || 1; up = up || 0; ench = ench || 0;
  for(var i=0;i<G.inv.length;i++){
    var it = G.inv[i];
    if(it.id===itemId && (it.up||0)===up && (it.ench||0)===ench){ it.q += q; atualizarMissoes('coletar', itemId, q); return true; }
  }
  if(G.inv.length >= 20){ toast('Mochila cheia!'); return false; }
  G.inv.push({id:itemId, q:q, up:up, ench:ench});
  atualizarMissoes('coletar', itemId, q);
  return true;
}
function invRemove(itemId, q){
  q = q || 1;
  for(var i=0;i<G.inv.length;i++){
    if(G.inv[i].id===itemId){ G.inv[i].q -= q; if(G.inv[i].q<=0) G.inv.splice(i,1); return true; }
  }
  return false;
}
function invCount(itemId){
  var t=0; for(var i=0;i<G.inv.length;i++) if(G.inv[i].id===itemId) t+=G.inv[i].q; return t;
}
function getItemDesc(id) {
  var d = ITEMS[id];
  if(!d) return 'Desconhecido';
  if(d.atk) return '⚔️ +' + d.atk + ' ATK';
  if(d.def) return '🛡️ +' + d.def + ' DEF';
  if(d.cura) return '❤️ +' + d.cura + ' HP';
  if(d.mana) return '💧 +' + d.mana + ' MP';
  return '📦 Material';
}

function playerAtk(){
  var w = G.equip.arma ? ITEMS[G.equip.arma] : null;
  return G.baseAtk + (w ? (w.atk||0) : 0);
}
function playerDef(){
  var s = 0;
  ['armadura','elmo','escudo','acessorio','botas'].forEach(function(sl){
    var id = G.equip[sl]; if(id && ITEMS[id]) s += (ITEMS[id].def||0);
  });
  var base = G.baseDef + s;
  if (G.buffDef > 0) base *= 1.5;
  return base;
}
function weaponCd(){
  var w = G.equip.arma; var baseCd = (w && WEAPON_CD[w]) ? WEAPON_CD[w] : 0.8;
  return baseCd / G.baseAtkSpd;
}

function xpNeed(l){ return 40 + l*25; }
function addXP(n){
  G.xp += n;
  while(G.xp >= xpNeed(G.level)){
    G.xp -= xpNeed(G.level); G.level++;
    G.hpMax += 10; G.mpMax += (G.classe === 'guerreiro') ? 10 : 5;
    G.baseAtk += 1.5; G.baseDef += 1.0; G.baseSpd += 2; G.baseEva += 0.5; G.baseAtkSpd += 0.05;
    G.hp = G.hpMax; G.mp = G.mpMax;
    toast('⭐ Subiu para o nível ' + G.level + '!');
    floatText(G.x, G.y-60, 'NÍVEL ' + G.level, '#ffd54f');
  }
}

/* ================= MISSÕES ================= */
function atualizarMissoes(tipo, alvo, qtd) {
  if (!G || !G.quests) return;
  for (var id in QUESTS) {
    var q = QUESTS[id];
    if (q.tipo === tipo && q.alvo === alvo) {
      var st = G.quests[id] || {progresso: 0, concluida: false, cooldown_ate: 0};
      if (st.cooldown_ate > Date.now() || (q.tipo_missao === 'unica' && st.concluida)) continue;
      if (st.progresso >= q.qtd) continue;
      st.progresso += (qtd || 1);
      G.quests[id] = st;
      if (st.progresso >= q.qtd) toast('📜 Missão pronta: ' + q.nome + '!');
    }
  }
}
function checarMissoesOuro() {
  if (!G || !G.quests) return;
  for (var id in QUESTS) {
    var q = QUESTS[id];
    if (q.tipo === 'ouro') {
      var st = G.quests[id] || {progresso: 0, concluida: false, cooldown_ate: 0};
      if (st.cooldown_ate > Date.now() || (q.tipo_missao === 'unica' && st.concluida)) continue;
      if (st.progresso >= q.qtd) continue;
      st.progresso = G.ouro; G.quests[id] = st;
      if (st.progresso >= q.qtd) toast('📜 Missão pronta: ' + q.nome + '!');
    }
  }
}

/* ================= MONSTROS ================= */
function makeMonster(type, x, y){
  var d = MONSTERS[type];
  if(!d) return null;
  return {type:type, x:x, y:y, hp:d.hp, hpMax:d.hp, alive:true, respawn:0, wx:x, wy:y, wt:Math.random()*2, stun:0, blind:0};
}
function spawnMonsters(){
  monsters = [];
  var tipos = ['goblin','goblin','lobo','goblin','lobo','esqueleto','orc','goblin'];
  for(var i=0;i<tipos.length;i++) monsters.push(makeMonster(tipos[i], 120 + Math.random()*1360, 120 + Math.random()*900));
  
  dlcZones.forEach(function(z){
    if (z.monstros) {
      z.monstros.forEach(function(mId) {
        for (var k=0; k<4; k++) {
           var m = makeMonster(mId, z.x + Math.random()*z.w, z.y + Math.random()*z.h);
           if(m) monsters.push(m);
        }
      });
    }
  });
}

function updateMonsters(dt){
  for(var i=0;i<monsters.length;i++){
    var m = monsters[i];
    if(!m.alive){
      m.respawn -= dt;
      if(m.respawn <= 0){
        m.alive = true; m.hp = m.hpMax; m.stun = 0; m.blind = 0;
        m.x = 120 + Math.random()*1360; m.y = 120 + Math.random()*900;
        m.wx = m.x; m.wy = m.y;
      }
      continue;
    }
    if(m.stun > 0) { m.stun -= dt; continue; }
    if(m.blind > 0) { m.blind -= dt; }
    if(combat && combat.m === m) continue;

    var md = MONSTERS[m.type];
    var distPlayer = Math.hypot(G.x - m.x, G.y - m.y);

    if(distPlayer < md.visao && SAVE.config.autoAttack){
      m.wx = G.x; m.wy = G.y;
      if(distPlayer < 42 && !combat) startCombat(m);
    } else {
      m.wt -= dt;
      if(m.wt <= 0){
        m.wt = 1.6 + Math.random()*2.2;
        m.wx = m.x + (Math.random()-0.5)*320; m.wy = m.y + (Math.random()-0.5)*320;
      }
    }
    var dx = m.wx - m.x, dy = m.wy - m.y, d = Math.hypot(dx, dy);
    if(d > 12){
      var s = md.spd * 0.42;
      m.x += (dx/d) * s * dt; m.y += (dy/d) * s * dt;
    }
    m.x = clamp(m.x, 70, WORLD.w-70); m.y = clamp(m.y, 70, WORLD.h-70);
  }
}

/* ================= INPUT ================= */
var joy = {id:null, active:false, cx:0, cy:0, x:0, y:0, mag:0, dead:14, max:72, moved:false, t0:0};
canvas.addEventListener('pointerdown', function(e){
  if(joy.id !== null) return;
  joy.id = e.pointerId; joy.active = true;
  joy.cx = e.clientX; joy.cy = e.clientY; joy.x = e.clientX; joy.y = e.clientY;
  joy.mag = 0; joy.moved = false; joy.t0 = performance.now();
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
});
canvas.addEventListener('pointermove', function(e){
  if(e.pointerId !== joy.id) return;
  joy.x = e.clientX; joy.y = e.clientY; joy.mag = Math.hypot(joy.x - joy.cx, joy.y - joy.cy);
  if(joy.mag > 16){ joy.moved = true; if(G && G.auto) G.auto = null; }
});
function endPointer(e){
  if(e.pointerId !== joy.id) return;
  var dur = performance.now() - joy.t0;
  if(!joy.moved && dur < 420) handleTap(joy.cx, joy.cy);
  joy.id = null; joy.active = false; joy.mag = 0;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

function handleTap(sx, sy){
  if(!G) return;
  var wx = sx + cam.x, wy = sy + cam.y;
  var best = null, bestD = 1e9;
  
  for(var i=0;i<monsters.length;i++){
    var m = monsters[i];
    if(!m.alive) continue;
    var d = Math.hypot(m.x-wx, m.y-wy);
    if(d < 55 && d < bestD){ best = {tipo:'monstro', ref:m}; bestD = d; }
  }
  for(var j=0;j<ground.length;j++){
    var g = ground[j];
    var d2 = Math.hypot(g.x-wx, g.y-wy);
    if(d2 < 50 && d2 < bestD){ best = {tipo:'item', ref:g}; bestD = d2; }
  }
  if(!best){
    for(var k=0;k<BUILDINGS.length;k++){
      var b = BUILDINGS[k];
      if(wx > b.x-20 && wx < b.x+b.w+20 && wy > b.y-20 && wy < b.y+b.h+40){
        best = {tipo:'predio', ref:b}; break;
      }
    }
  }

  var isSameTarget = best && best.tipo === 'monstro' && combat && combat.m === best.ref;
  if(!isSameTarget && combat) fimCombate();

  if(best){
    if(best.tipo === 'monstro'){
      var dist = Math.hypot(best.ref.x-G.x, best.ref.y-G.y);
      if(dist > 60) G.auto = {tipo:'monstro', ref:best.ref, x:best.ref.x, y:best.ref.y, range:55};
      else {
        if(!combat) startCombat(best.ref);
        if(combat && combat.m === best.ref && !SAVE.config.autoAttack && combat.atkCd <= 0) {
          fazerAtaque(); if(combat) combat.atkCd = weaponCd();
        }
      }
    } else {
      var tx, ty, range;
      if(best.tipo === 'item'){ tx = best.ref.x; ty = best.ref.y; range = 28; }
      else { tx = best.ref.x + best.ref.w/2; ty = best.ref.y + best.ref.h + 34; range = 40; }
      G.auto = {tipo:best.tipo, ref:best.ref, x:tx, y:ty, range:range};
    }
  } else { G.auto = {tipo:'ponto', x:wx, y:wy, range:8}; }
}

function doAutoAction(){
  if(!G.auto) return;
  var a = G.auto; G.auto = null;
  if(a.tipo === 'monstro'){ if(a.ref.alive) startCombat(a.ref); }
  else if(a.tipo === 'item'){ pegarItem(a.ref); }
  else if(a.tipo === 'predio'){ abrirPredio(a.ref.id); }
}

/* ================= MOVIMENTO ================= */
function clampToWorld(){
  G.x = clamp(G.x, 22, WORLD.w-22); G.y = clamp(G.y, 22, WORLD.h-22);
  
  for(var i=0;i<BUILDINGS.length;i++){
    var b = BUILDINGS[i], pad = 14;
    var rx = b.x-pad, ry = b.y-pad, rw = b.w+pad*2, rh = b.h+pad*2;
    if(G.x > rx && G.x < rx+rw && G.y > ry && G.y < ry+rh){
      var dl = G.x-rx, dr = rx+rw-G.x, dtp = G.y-ry, db = ry+rh-G.y;
      var mn = Math.min(dl,dr,dtp,db);
      if(mn === dl) G.x = rx; else if(mn === dr) G.x = rx+rw;
      else if(mn === dtp) G.y = ry; else G.y = ry+rh;
    }
  }

  if (G.y >= CAMPOS_Y && G.y <= VILA.y) {
    var inBridgeX = (G.x >= PONTE.x + 15 && G.x <= PONTE.x + PONTE.w - 15);
    if (!inBridgeX) {
      var distTop = G.y - CAMPOS_Y, distBot = VILA.y - G.y;
      if (distTop < distBot) G.y = CAMPOS_Y - 1; else G.y = VILA.y + 1;
    }
  }

  if (G.y >= 2320 && G.y <= 2400) {
    var inPonteSul = (G.x >= 650 && G.x <= 950);
    if (!inPonteSul) {
      if (G.y < 2360) G.y = 2319; else G.y = 2401;
    }
  }

  if (document.getElementById('overlay').classList.contains('hidden') && !combat) {
    for (var i = 0; i < BUILDINGS.length; i++) {
      var b = BUILDINGS[i];
      var doorX = b.x + b.w/2, doorY = b.y + b.h;
      var dist = Math.hypot(G.x - doorX, G.y - doorY);
      if (dist < 40) { G.y = doorY + 40; abrirPredio(b.id); break; }
    }
  }
}

function updateMovement(dt){
  var vx = 0, vy = 0;
  if(joy.active && joy.mag > joy.dead){
    var nx = (joy.x - joy.cx) / joy.mag, ny = (joy.y - joy.cy) / joy.mag;
    var forca = Math.min(1, (joy.mag - joy.dead) / (joy.max - joy.dead));
    vx = nx * forca; vy = ny * forca;
  } else if(G.auto){
    var dx = G.auto.x - G.x, dy = G.auto.y - G.y, d = Math.hypot(dx, dy);
    if(d <= G.auto.range){ doAutoAction(); return; }
    vx = dx/d; vy = dy/d;
  }
  if(vx !== 0 || vy !== 0){
    var sp = G.baseSpd;
    G.x += vx * sp * dt; G.y += vy * sp * dt;
    G.dir = Math.atan2(vy, vx);
    clampToWorld();
  }
}

/* ================= ITENS E COMBATE ================= */
function dropar(x, y, itemId, q){
  ground.push({x:x + (Math.random()-0.5)*36, y:y + (Math.random()-0.5)*36, id:itemId, q:q||1, t:0});
}
function updateGround(dt){
  for(var i=ground.length-1;i>=0;i--){
    var g = ground[i]; g.t += dt;
    if(g.t > 120){ ground.splice(i,1); continue; }
    if(SAVE.config.autoCollect){
      var d = Math.hypot(g.x - G.x, g.y - G.y);
      if(d < 30) pegarItem(g);
    }
  }
}
function pegarItem(g){
  if(invAdd(g.id, g.q)){
    toast('+' + g.q + ' ' + (ITEMS[g.id] ? ITEMS[g.id].e : '') + ' ' + (ITEMS[g.id] ? ITEMS[g.id].n : 'Item'));
    floatText(g.x, g.y-16, '+' + (ITEMS[g.id] ? ITEMS[g.id].n : 'Item'), '#9be36b');
    var i = ground.indexOf(g); if(i >= 0) ground.splice(i,1);
    persist();
  }
}
function coletar(){
  if(!G) return;
  var best = null, bestD = 70;
  for(var i=0;i<ground.length;i++){
    var g = ground[i], d = Math.hypot(g.x - G.x, g.y - G.y);
    if(d < bestD){ best = g; bestD = d; }
  }
  if(best) pegarItem(best); else toast('Nada para coletar perto');
}

function getNearestMonster(maxDist) {
  var best = null, bestD = maxDist || 9999;
  for(var i=0;i<monsters.length;i++){
    var m = monsters[i]; if(!m.alive) continue;
    var d = Math.hypot(m.x - G.x, m.y - G.y);
    if(d < bestD) { best = m; bestD = d; }
  }
  return best;
}
function startCombat(m){
  if(combat && combat.m === m) return;
  var d = MONSTERS[m.type];
  combat = {m:m, atkCd:0, skCds:[0,0,0,0], mCd:1.4, t:0};
  document.getElementById('combat').classList.add('on');
  floatText(m.x, m.y-40, '⚔️ ' + d.n, '#ff8a65');
}
function fimCombate(){ combat = null; document.getElementById('combat').classList.remove('on'); }
function fazerAtaque(){
  if(!combat) return;
  var m = combat.m, d = MONSTERS[m.type];
  if(Math.random() > 0.85){ floatText(m.x, m.y-30, 'errou', '#999'); return; }
  var dmg = Math.max(1, playerAtk() - d.def*0.5) * (0.9 + Math.random()*0.2);
  var crit = Math.random() < 0.1; if(crit) dmg *= 1.5;
  dmg = Math.round(dmg); m.hp -= dmg;
  floatText(m.x, m.y-30, (crit?'CRÍTICO ':'') + dmg, crit?'#ffd54f':'#fff');
  if(m.hp <= 0) matarMonstro(m);
}
function atacar(){
  if(!combat){
    var mm = getNearestMonster(70);
    if(mm){ startCombat(mm); fazerAtaque(); if(combat) combat.atkCd = weaponCd(); return; }
    toast('Aproxime-se de um monstro'); return;
  }
  if(combat.atkCd > 0) return;
  var dist = Math.hypot(G.x-combat.m.x, G.y-combat.m.y);
  if(dist > 60) return;
  fazerAtaque(); if(combat) combat.atkCd = weaponCd();
}

function usarSkill(idx){
  if(!combat && CLASSES[G.classe].skills[idx].mult) {
    var mm = getNearestMonster(70);
    if(mm) startCombat(mm); else { toast('Sem alvo'); return; }
  }
  if(!combat) return;
  if(combat.skCds[idx] > 0) return;
  var sk = CLASSES[G.classe].skills[idx];
  if(G.mp < sk.custo){ toast('MP insuficiente!'); return; }
  G.mp -= sk.custo; combat.skCds[idx] = sk.cd;
  
  if(sk.visual === 'meteoro') { screenShake = 0.6; flashAlpha = 0.8; }
  if(sk.visual === 'chuva') { screenShake = 0.4; }

  if(sk.cura) { G.hp = Math.min(G.hpMax, G.hp + sk.cura); floatText(G.x, G.y-40, sk.n + ' +' + sk.cura + '❤️', '#66bb6a'); } 
  else if(sk.buffDef) { G.buffDef = sk.buffDef; floatText(G.x, G.y-40, sk.n + ' 🛡️+', '#f1c40f'); }
  else if(sk.buffEva) { G.buffEva = sk.buffEva; floatText(G.x, G.y-40, sk.n + ' 💨+', '#f1c40f'); }
  else {
    var m = combat.m, d = MONSTERS[m.type];
    var base = Math.max(1, playerAtk() - (sk.ignoraDef ? 0 : d.def*0.5));
    var dmg = Math.round(base * sk.mult + (sk.bonus||0));
    var crit = false;
    if(sk.critChance && Math.random() < sk.critChance) { dmg *= 2; crit = true; }
    m.hp -= dmg;
    floatText(m.x, m.y-40, (crit?'CRÍTICO ':'') + sk.n + ' ' + dmg, crit?'#ffd54f':'#64b5f6');
    if(sk.stun) { m.stun = sk.stun; floatText(m.x, m.y-60, '❄️ Congelado!', '#81d4fa'); }
    if(sk.blind) { m.blind = sk.blind; floatText(m.x, m.y-60, '👁️ Cego!', '#b0bec5'); }
    if(m.hp <= 0) matarMonstro(m);
  }
}

function usarPocaoVida(){
  if(G.potCdV > 0){ toast('Poção recarregando'); return; }
  if(invCount('pocao_vida') <= 0){ toast('Sem poção de vida'); return; }
  if(G.hp >= G.hpMax){ toast('Vida já cheia'); return; }
  invRemove('pocao_vida', 1); G.hp = Math.min(G.hpMax, G.hp + 50); G.potCdV = 4;
  floatText(G.x, G.y-40, '+50 ❤️', '#66bb6a'); persist();
}
function usarPocaoMana(){
  if(G.potCdM > 0){ toast('Poção recarregando'); return; }
  if(invCount('pocao_mana') <= 0){ toast('Sem poção de mana'); return; }
  if(G.mp >= G.mpMax){ toast('Mana já cheia'); return; }
  invRemove('pocao_mana', 1); G.mp = Math.min(G.mpMax, G.mp + 40); G.potCdM = 4;
  floatText(G.x, G.y-40, '+40 💧', '#42a5f5'); persist();
}

function matarMonstro(m){
  var d = MONSTERS[m.type];
  m.alive = false; m.respawn = 26; m.hp = 0;
  G.ouro += d.ouro; addXP(d.xp);
  floatText(m.x, m.y-50, '+' + d.ouro + '💰 +' + d.xp + 'XP', '#ffd54f');
  
  atualizarMissoes('matar', m.type, 1);

  for(var i=0;i<d.drops.length;i++){
    var dr = d.drops[i]; if(Math.random() < dr[1]) dropar(m.x, m.y, dr[0], 1);
  }
  fimCombate(); persist();
}

function morrer(){
  var perda = Math.floor(G.ouro * 0.5);
  G.ouro -= perda; G.hp = G.hpMax; G.mp = G.mpMax;
  G.x = 800; G.y = 1900; G.auto = null; G.buffDef = 0; G.buffEva = 0;
  fimCombate(); toast('💀 Você caiu! Perdeu ' + perda + ' de ouro.'); persist();
}

function updateCombat(dt){
  var m = combat.m, d = MONSTERS[m.type];
  combat.t += dt; combat.atkCd = Math.max(0, combat.atkCd - dt);
  for(var i=0; i<4; i++) combat.skCds[i] = Math.max(0, combat.skCds[i] - dt);
  if (G.buffDef > 0) G.buffDef -= dt;
  if (G.buffEva > 0) G.buffEva -= dt;

  var dist = Math.hypot(G.x-m.x, G.y-m.y);
  if(dist > 170){ toast('Você se afastou do combate'); fimCombate(); return; }

  if(dist > 55){
    var dx = m.x - G.x, dy = m.y - G.y, sp = G.baseSpd;
    G.x += (dx/dist) * sp * dt; G.y += (dy/dist) * sp * dt;
    G.dir = Math.atan2(dy, dx); clampToWorld();
  }

  if(dist <= 60 && combat.atkCd <= 0 && SAVE.config.autoAttack){
    fazerAtaque(); if(!combat) return; combat.atkCd = weaponCd();
  }

  combat.mCd -= dt;
  if(combat.mCd <= 0){
    combat.mCd = 1.7;
    if (m.stun > 0) { floatText(m.x, m.y-30, '❄️ Congelado', '#81d4fa'); return; }
    var missChance = 0.15; if (m.blind > 0) missChance = 0.7; if (G.buffEva > 0) missChance = 1.0;
    if (Math.random() < missChance) { floatText(G.x, G.y-42, 'desviou!', '#f1c40f'); return; }
    var dmg = Math.max(1, d.atk - playerDef()*0.4) * (0.9 + Math.random()*0.2);
    dmg = Math.round(dmg); G.hp -= dmg; floatText(G.x, G.y-42, '-' + dmg, '#ff5252');
    if(G.hp <= 0){ morrer(); return; }
  }

  var skills = CLASSES[G.classe].skills;
  for(var j=0; j<4; j++) {
    var btn = document.getElementById('skBtn'+j);
    btn.classList.toggle('cd', combat.skCds[j] > 0 || G.mp < skills[j].custo);
    var existing = btn.querySelector('.cd-txt');
    if(combat.skCds[j] > 0) {
      if(!existing) { existing = document.createElement('div'); existing.className = 'cd-txt'; btn.appendChild(existing); }
      existing.textContent = Math.ceil(combat.skCds[j]);
    } else if(existing) { existing.remove(); }
  }
}

function update(dt){
  if(!G) return;
  gameTime += dt;
  G.potCdV = Math.max(0, G.potCdV - dt); G.potCdM = Math.max(0, G.potCdM - dt);
  if(screenShake > 0) screenShake -= dt;
  if(flashAlpha > 0) flashAlpha -= dt * 2;

  if(combat && joy.active && joy.mag > joy.dead) fimCombate();
  if(combat){ updateCombat(dt); } else { updateMovement(dt); }

  updateMonsters(dt); updateGround(dt);
  
  if(Math.floor(gameTime) % 2 === 0) checarMissoesOuro();

  for(var i=floats.length-1;i>=0;i--){
    var f = floats[i]; f.life -= dt; f.y += f.vy*dt; f.vy *= 0.96;
    if(f.life <= 0) floats.splice(i,1);
  }
  if(G.y > VILA.y && !combat){ G.hp = Math.min(G.hpMax, G.hp + 6*dt); G.mp = Math.min(G.mpMax, G.mp + 8*dt); }
  
  if (SAVE.config.showCoords) {
    document.getElementById('coords').textContent = 'X: ' + Math.round(G.x) + ' | Y: ' + Math.round(G.y);
  }

  atualizarHUD();
  if(gameTime - lastSave > 12){ lastSave = gameTime; persist(); }
}

function atualizarHUD(){
  if(!G) return;
  var c = CLASSES[G.classe];
  document.getElementById('sNome').textContent = c.e + ' ' + G.nome;
  document.getElementById('sHp').textContent = '❤️ ' + Math.ceil(G.hp) + '/' + G.hpMax;
  document.getElementById('sMp').textContent = '💧 ' + Math.ceil(G.mp) + '/' + G.mpMax;
  document.getElementById('sOuro').textContent = '💰 ' + G.ouro;
  document.getElementById('sLvl').textContent = '⭐ Nv ' + G.level;
}

function drawMinimap(){
  if(!SAVE.config.showMinimap) return;
  
  var mWidth = minimapCanvas.width;
  var mHeight = minimapCanvas.height;
  mmCtx.clearRect(0, 0, mWidth, mHeight);
  
  var scaleX = mWidth / WORLD.w;
  var scaleY = mHeight / WORLD.h;
  var scale = Math.min(scaleX, scaleY);
  
  mmCtx.fillStyle = 'rgba(0,0,0,0.5)';
  mmCtx.fillRect(0, 0, mWidth, mHeight);

  mmCtx.fillStyle = '#3f6b3a';
  mmCtx.fillRect(0, 0, WORLD.w * scale, CAMPOS_Y * scale);
  
  mmCtx.fillStyle = '#6b8f4e';
  mmCtx.fillRect(VILA.x * scale, VILA.y * scale, VILA.w * scale, VILA.h * scale);
  
  dlcZones.forEach(function(z) {
    mmCtx.fillStyle = z.cor || '#555';
    mmCtx.fillRect(z.x * scale, z.y * scale, z.w * scale, z.h * scale);
    mmCtx.strokeStyle = 'rgba(255,255,255,0.3)';
    mmCtx.lineWidth = 1;
    mmCtx.strokeRect(z.x * scale, z.y * scale, z.w * scale, z.h * scale);
  });
  
  mmCtx.fillStyle = '#000';
  mmCtx.fillRect(0, 2320 * scale, WORLD.w * scale, 80 * scale);
  mmCtx.fillStyle = '#8a5a2b';
  mmCtx.fillRect(650 * scale, 2320 * scale, 300 * scale, 80 * scale);

  mmCtx.fillStyle = '#fff';
  mmCtx.beginPath();
  mmCtx.arc(G.x * scale, G.y * scale, 3, 0, Math.PI*2);
  mmCtx.fill();
  mmCtx.strokeStyle = '#000';
  mmCtx.lineWidth = 1;
  mmCtx.stroke();
}

function draw(){
  if(!G){ ctx.fillStyle='#141420'; ctx.fillRect(0,0,W,H); return; }
  var shakeX = 0, shakeY = 0;
  if (screenShake > 0) { shakeX = (Math.random()-0.5)*20*screenShake; shakeY = (Math.random()-0.5)*20*screenShake; }

  cam.x = clamp(G.x - W/2, 0, Math.max(0, WORLD.w - W));
  cam.y = clamp(G.y - H/2, 0, Math.max(0, WORLD.h - H));
  
  ctx.save(); ctx.translate(shakeX, shakeY);
  ctx.fillStyle = '#0d1a0d'; ctx.fillRect(-cam.x-50, -cam.y-50, WORLD.w+100, WORLD.h+100);

  ctx.fillStyle = '#3f6b3a'; ctx.fillRect(-cam.x, -cam.y, WORLD.w, CAMPOS_Y);
  ctx.fillStyle = '#2a5f8f'; ctx.fillRect(-cam.x, CAMPOS_Y - cam.y, WORLD.w, VILA.y - CAMPOS_Y);
  
  ctx.fillStyle = '#111'; ctx.fillRect(-cam.x, 2320 - cam.y, WORLD.w, 80);
  ctx.fillStyle = '#4a3520'; ctx.fillRect(650 - cam.x, 2320 - cam.y, 300, 80);
  ctx.fillStyle = '#8a6b45'; for(var p2=0; p2<300; p2+=15) ctx.fillRect(650 + p2 - cam.x, 2320 - cam.y, 5, 80);

  var floresta = dlcZones.find(function(z){ return z.id === 'floresta'; });
  if (floresta) {
    ctx.fillStyle = '#8a5a2b';
    ctx.fillRect(1500 - cam.x, 1600 - cam.y, 100, 150);
    ctx.fillStyle = '#6d4520';
    for(var c2=0; c2<150; c2+=15) ctx.fillRect(1500 - cam.x + (Math.random()*80), 1600 + c2 - cam.y, 15, 8);
  }
  
  dlcZones.forEach(function(z) {
    ctx.fillStyle = z.cor || '#555';
    ctx.fillRect(z.x - cam.x, z.y - cam.y, z.w, z.h);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(z.x - cam.x, z.y - cam.y, z.w, z.h);
    ctx.font = '20px system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.textAlign = 'center';
    ctx.fillText(z.nome, z.x + z.w/2 - cam.x, z.y + 30 - cam.y);
  });

  ctx.fillStyle = 'rgba(255,255,255,.10)';
  for(var i=0;i<12;i++){
    var yy = CAMPOS_Y + i*18;
    ctx.fillRect(-cam.x + ((i*137 + gameTime*18) % WORLD.w), yy - cam.y, 46, 2);
  }
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(PONTE.x - cam.x, PONTE.y - cam.y, PONTE.w, PONTE.h);
  ctx.fillStyle = '#6d4520'; for(var p=0;p<PONTE.h;p+=14) ctx.fillRect(PONTE.x - cam.x, PONTE.y + p - cam.y, PONTE.w, 3);
  ctx.fillStyle = '#6b8f4e'; ctx.fillRect(VILA.x - cam.x, VILA.y - cam.y, VILA.w, VILA.h);
  ctx.strokeStyle = '#5d4322'; ctx.lineWidth = 14; ctx.strokeRect(VILA.x - cam.x, VILA.y - cam.y, VILA.w, VILA.h);

  for(var f2=0; f2<FLOWERS.length; f2++){
    var fl = FLOWERS[f2];
    if(fl.x < cam.x-30 || fl.x > cam.x+W+30 || fl.y < cam.y-30 || fl.y > cam.y+H+30) continue;
    ctx.fillStyle = fl.c; ctx.beginPath(); ctx.arc(fl.x-cam.x, fl.y-cam.y, 3, 0, 6.29); ctx.fill();
  }
  for(var t=0;t<TREES.length;t++){
    var tr = TREES[t];
    if(tr.x < cam.x-40 || tr.x > cam.x+W+40 || tr.y < cam.y-40 || tr.y > cam.y+H+40) continue;
    ctx.fillStyle = '#3a2412'; ctx.fillRect(tr.x - cam.x - 3, tr.y - cam.y, 6, 12);
    ctx.fillStyle = tr.c; ctx.beginPath(); ctx.arc(tr.x-cam.x, tr.y-cam.y-4, tr.r, 0, 6.29); ctx.fill();
  }
  for(var b=0;b<BUILDINGS.length;b++){
    var bd = BUILDINGS[b];
    ctx.fillStyle = '#4a3520'; ctx.fillRect(bd.x - cam.x, bd.y - cam.y, bd.w, bd.h);
    ctx.fillStyle = '#8a6b45'; ctx.fillRect(bd.x - cam.x + 8, bd.y - cam.y + 8, bd.w - 16, bd.h - 30);
    ctx.fillStyle = '#2c1e10'; ctx.fillRect(bd.x + bd.w/2 - 22 - cam.x, bd.y + bd.h - 44 - cam.y, 44, 44);
    ctx.font = '26px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(bd.e, bd.x + bd.w/2 - cam.x, bd.y + 52 - cam.y);
    ctx.font = '11px system-ui'; ctx.fillStyle = '#fff';
    ctx.fillText(bd.nome, bd.x + bd.w/2 - cam.x, bd.y + bd.h + 18 - cam.y);
  }
  for(var g2=0;g2<ground.length;g2++){
    var it = ground[g2];
    if(it.x < cam.x-40 || it.x > cam.x+W+40 || it.y < cam.y-40 || it.y > cam.y+H+40) continue;
    var bob = Math.sin(gameTime*4 + g2) * 3;
    ctx.font = '20px system-ui'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.arc(it.x-cam.x, it.y-cam.y + bob, 15, 0, 6.29); ctx.fill();
    ctx.fillText(ITEMS[it.id] ? ITEMS[it.id].e : '❓', it.x-cam.x, it.y-cam.y + bob + 7);
  }
  for(var m2=0;m2<monsters.length;m2++){
    var mo = monsters[m2];
    if(!mo.alive) continue;
    if(mo.x < cam.x-70 || mo.x > cam.x+W+70 || mo.y < cam.y-70 || mo.y > cam.y+H+70) continue;
    var md = MONSTERS[mo.type];
    if(!md) continue;
    var flash = (combat && combat.m === mo && combat.mCd < 0.5);
    ctx.fillStyle = flash ? '#ff3b3b' : md.cor;
    if (mo.stun > 0) ctx.fillStyle = '#81d4fa';
    ctx.beginPath(); ctx.arc(mo.x-cam.x, mo.y-cam.y, md.r, 0, 6.29); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = (md.r*1.35) + 'px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(md.e, mo.x-cam.x, mo.y-cam.y + md.r*0.42);
    if(SAVE.config.showMonsterHp) {
      var bw = md.r*2.2;
      ctx.fillStyle = '#000'; ctx.fillRect(mo.x - bw/2 - cam.x, mo.y - md.r - 18 - cam.y, bw, 5);
      ctx.fillStyle = '#e74c3c'; ctx.fillRect(mo.x - bw/2 - cam.x, mo.y - md.r - 18 - cam.y, bw*(mo.hp/mo.hpMax), 5);
      ctx.font = 'bold 10px system-ui'; ctx.fillStyle = '#ffd54f'; ctx.textAlign = 'center';
      ctx.fillText('Lv ' + md.lvl, mo.x - cam.x, mo.y - md.r - 22 - cam.y);
    }
    if(combat && combat.m === mo){
      ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(mo.x-cam.x, mo.y-cam.y, md.r + 8 + Math.sin(gameTime*6)*2, 0, 6.29); ctx.stroke();
    }
  }
  var cl = CLASSES[G.classe];
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(G.x-cam.x, G.y-cam.y+16, 15, 7, 0, 0, 6.29); ctx.fill();
  if (G.buffEva > 0) ctx.fillStyle = 'rgba(255,255,255,.5)';
  else if (G.buffDef > 0) ctx.fillStyle = '#f1c40f';
  else ctx.fillStyle = cl.cor;
  ctx.beginPath(); ctx.arc(G.x-cam.x, G.y-cam.y, 17, 0, 6.29); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.font = '20px system-ui'; ctx.textAlign = 'center'; ctx.fillText(cl.e, G.x-cam.x, G.y-cam.y + 7);

  if(SAVE.config.showPlayerHp) {
    var pw = 44, px = G.x - pw/2 - cam.x, py = G.y - 38 - cam.y;
    ctx.fillStyle = '#000'; ctx.fillRect(px, py, pw, 4);
    ctx.fillStyle = '#e74c3c'; ctx.fillRect(px, py, pw*(G.hp/G.hpMax), 4);
    ctx.fillStyle = '#000'; ctx.fillRect(px, py+6, pw, 4);
    ctx.fillStyle = '#3498db'; ctx.fillRect(px, py+6, pw*(G.mp/G.mpMax), 4);
  }
  if(G.auto){
    var ax = G.auto.x - cam.x, ay = G.auto.y - cam.y;
    ctx.strokeStyle = 'rgba(255,213,79,.85)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(ax, ay, 14 + Math.sin(gameTime*7)*3, 0, 6.29); ctx.stroke();
  }
  ctx.textAlign = 'center';
  for(var f3=0;f3<floats.length;f3++){
    var fo = floats[f3]; ctx.globalAlpha = Math.min(1, fo.life*1.6);
    ctx.fillStyle = fo.c; ctx.font = 'bold 15px system-ui'; ctx.fillText(fo.t, fo.x-cam.x, fo.y-cam.y);
  }
  ctx.globalAlpha = 1;

  if(joy.active && joy.mag > 0){
    ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.cx, joy.cy, joy.max, 0, 6.29); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.beginPath(); ctx.arc(joy.cx, joy.cy, joy.max, 0, 6.29); ctx.fill();
    var kx = joy.cx, ky = joy.cy;
    if(joy.mag > 0){ var kk = Math.min(joy.mag, joy.max) / joy.mag; kx = joy.cx + (joy.x - joy.cx)*kk; ky = joy.cy + (joy.y - joy.cy)*kk; }
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(kx, ky, 24, 0, 6.29); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.textAlign = 'left'; ctx.font = '11px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.55)';
  var zona = (G.y < CAMPOS_Y) ? 'CAMPOS' : (G.y < VILA.y ? 'PONTE' : 'VILA');
  ctx.fillText(zona, 10 - shakeX, H - 10 - shakeY);
  ctx.restore();
  if (flashAlpha > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flashAlpha + ')'; ctx.fillRect(0,0,W,H); }
  
  drawMinimap();
}

var lastT = performance.now();
function loop(t){ var dt = Math.min(0.05, (t - lastT) / 1000); lastT = t; update(dt); draw(); requestAnimationFrame(loop); }

function deletarChar(id){ if(Object.keys(SAVE.chars).length <= 1){ toast('Precisa ter pelo menos 1 herói'); return; } if(!confirm('Apagar ' + SAVE.chars[id].nome + '?')) return; delete SAVE.chars[id]; if(currentId === id){ currentId = Object.keys(SAVE.chars)[0]; G = SAVE.chars[currentId]; } persist(); telaPersonagens(); }

function abrirInventario(){
  var html = '<h2>🎒 Inventário</h2><h3>Equipado</h3>';
  var slots = [['arma','Arma'],['armadura','Armadura'],['elmo','Elmo'],['escudo','Escudo'],['acessorio','Acessório'],['botas','Botas']];
  slots.forEach(function(s){
    var id = G.equip[s[0]];
    var txt = id ? (ITEMS[id].e + ' ' + ITEMS[id].n + ' <small style="color:#8fd">' + getItemDesc(id) + '</small>') : '— vazio —';
    html += '<div class="row"><span><small style="opacity:.55">' + s[1] + '</small><br>' + txt + '</span>' + (id ? '<button class="btn red" onclick="desequipar(\'' + s[0] + '\')">Tirar</button>' : '') + '</div>';
  });
  html += '<h3>Mochila (' + G.inv.length + '/20)</h3>';
  if(G.inv.length === 0) html += '<p style="opacity:.5;font-size:13px;padding:8px">Vazia.</p>';
  G.inv.forEach(function(it, idx){
    var d = ITEMS[it.id]; if(!d) return;
    var extra = it.up ? (' +' + it.up) : ''; var ench = it.ench ? ' 🔥' : '';
    html += '<div class="row"><span>' + d.e + ' ' + d.n + extra + ench + ' <small style="opacity:.6">x' + it.q + '</small><br><small style="color:#8fd;font-size:11px">' + getItemDesc(it.id) + '</small></span><span><button class="btn" onclick="usarOuEquipar(' + idx + ')">' + (d.t === 'consumivel' ? 'Usar' : (d.t === 'arma' || d.t === 'armadura' ? 'Equipar' : '—')) + '</button></span></div>';
  });
  html += '<div style="text-align:center;margin-top:12px"><button class="btn gray" onclick="closeOverlay()">Fechar</button></div>';
  openOverlay(html);
}

function usarOuEquipar(idx){
  var it = G.inv[idx]; if(!it) return;
  var d = ITEMS[it.id]; if(!d) return;
  if(d.t === 'consumivel'){
    if(it.id === 'pocao_vida'){ if(G.hp >= G.hpMax){ toast('Vida já cheia'); return; } G.hp = Math.min(G.hpMax, G.hp + (d.cura||50)); invRemove(it.id, 1); toast('+' + (d.cura||50) + ' de vida'); } 
    else if(it.id === 'pocao_mana'){ if(G.mp >= G.mpMax){ toast('Mana já cheia'); return; } G.mp = Math.min(G.mpMax, G.mp + (d.mana||40)); invRemove(it.id, 1); toast('+' + (d.mana||40) + ' de mana'); }
  } else if(d.slot){
    var antigo = G.equip[d.slot]; G.equip[d.slot] = it.id; invRemove(it.id, 1);
    if(antigo) invAdd(antigo, 1, it.up, it.ench); toast('Equipado: ' + d.n);
  } else { toast('Item de material.'); }
  persist(); abrirInventario();
}
function desequipar(slot){ var id = G.equip[slot]; if(!id) return; if(invAdd(id, 1, 0, 0)) G.equip[slot] = null; persist(); abrirInventario(); }

function abrirPredio(id){
  if(id === 'ferreiro') abrirFerreiro();
  else if(id === 'armeiro') abrirArmeiro();
  else if(id === 'vendedora') abrirVendedora();
  else if(id === 'alquimista') abrirAlquimista();
  else if(id === 'banqueiro') abrirBanco();
  else if(id === 'anciao') abrirAnciao();
  else if(id === 'cacador') abrirCacador();
  else if(id === 'cabana_eremita') abrirEremita();
  else toast('Prédio da DLC aberto!');
}

function abrirFerreiro(){
  var html = '<h2>🔨 Ferreiro</h2><p style="font-size:12px;opacity:.65;margin-bottom:8px">"Deixa comigo!"</p><h3>Melhorar equipamento</h3>';
  var achou = false;
  G.inv.forEach(function(it, i){
    var d = ITEMS[it.id]; if(!d || (d.t !== 'arma' && d.t !== 'armadura')) return;
    var up = it.up || 0; if(up >= 3) return;
    achou = true; var custo = 40 * (up + 1);

  });

  html += '<div style="text-align:center;margin-top:12px"><button class="btn gray" onclick="closeOverlay()">Fechar</button></div>';

function melhorar(i){
  var it = G.inv[i]; if(!it) return; var up = it.up || 0; var custo = 40 * (up + 1);
  if(G.ouro < custo){ toast('Ouro insuficiente'); return; }
  G.ouro -= custo; it.up = up + 1; toast('Melhorado para +' + it.up); persist(); abrirFerreiro();

function abrirAnciao(){
  var html = '<h2>📜 Mural de Missões</h2>';
  var temMissao = false;

  for (var id in QUESTS) {
    var q = QUESTS[id];
    var st = G.quests[id] || {progresso: 0, concluida: false, cooldown_ate: 0};
    if (q.tipo_missao === 'unica' && st.concluida) continue;

    temMissao = true;
    html += '<div class="row" style="flex-direction:column;align-items:flex-start;gap:4px">';
    html += '<div style="display:flex;justify-content:space-between;width:100%"><b>' + q.nome + '</b>';
    
    if (st.cooldown_ate > Date.now()) {
      var restante = st.cooldown_ate - Date.now();
      var h = Math.floor(restante / 3600000);
      var m = Math.floor((restante % 3600000) / 60000);
      html += '<span style="color:#e74c3c;font-size:12px">⏳ ' + h + 'h ' + m + 'm</span>';
    } else if (st.progresso >= q.qtd) {
      html += '<button class="btn" onclick="resgatarMissao(\'' + id + '\')">🎁 Resgatar</button>';
    } else {
      html += '<span style="color:#8fd;font-size:12px">' + st.progresso + '/' + q.qtd + '</span>';
    }
    
    html += '</div><small style="opacity:.7">' + q.desc + '</small>';
    
    var recomp = [];
    if(q.r_ouro) recomp.push(q.r_ouro + '💰');
    if(q.r_xp) recomp.push(q.r_xp + 'XP');
    if(q.r_item) recomp.push(ITEMS[q.r_item] ? ITEMS[q.r_item].n : q.r_item);
    html += '<small style="color:#ffd54f">Recompensa: ' + recomp.join(' + ') + '</small>';
    
    html += '</div>';
  }

  if(!temMissao) html += '<p style="opacity:.5;font-size:13px;padding:8px">Nenhuma missão disponível no momento.</p>';
  html += '<div style="text-align:center;margin-top:12px"><button class="btn gray" onclick="closeOverlay()">Fechar</button></div>';
  openOverlay(html);
}

function resgatarMissao(id) {
  var q = QUESTS[id];
  var st = G.quests[id];
  if (!q || !st || st.progresso < q.qtd) return;

  if (q.r_ouro) G.ouro += q.r_ouro;
  if (q.r_xp) addXP(q.r_xp);
  if (q.r_item) invAdd(q.r_item, 1);

  var txtRecompensa = [];
  if (q.r_ouro) txtRecompensa.push(q.r_ouro + '💰');
  if (q.r_xp) txtRecompensa.push(q.r_xp + 'XP');
  if (q.r_item) txtRecompensa.push(ITEMS[q.r_item] ? ITEMS[q.r_item].n : q.r_item);
  toast('Recompensa: ' + txtRecompensa.join(', '));

  if (q.tipo_missao === 'unica') { st.concluida = true; st.progresso = q.qtd; } 
  else { st.cooldown_ate = Date.now() + (q.cooldown_horas * 3600000); st.progresso = 0; }

  persist(); abrirAnciao();
}

function comprar(id){
  var d = ITEMS[id]; if(!d) return;
  if(G.ouro < d.preco){ toast('Ouro insuficiente'); return; }
  if(!invAdd(id, 1)) return; G.ouro -= d.preco; toast('Comprou ' + d.n); persist();
  recarregarLoja();
}
function vender(i){
  var it = G.inv[i]; if(!it) return; var d = ITEMS[it.id]; if(!d) return;
  var preco = Math.floor(d.preco * 0.5); G.ouro += preco; invRemove(it.id, 1);
  toast('Vendeu por ' + preco + '💰'); persist();
  recarregarLoja();
}

function toggleFull(){
  var el = document.documentElement;
  if(!document.fullscreenElement && !document.webkitFullscreenElement){
    if(el.requestFullscreen) el.requestFullscreen().catch(function(){});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
  setTimeout(resize, 350);
}

function instalarDLC(dlc) {
  if (dlc.itens) for (var id in dlc.itens) ITEMS[id] = dlc.itens[id];
  if (dlc.monstros) for (var id in dlc.monstros) MONSTERS[id] = dlc.monstros[id];
  if (dlc.predios) dlc.predios.forEach(function(p) { BUILDINGS.push(p); });
  if (dlc.missoes) for (var id in dlc.missoes) QUESTS[id] = dlc.missoes[id];
  if (dlc.mapas) {
    dlc.mapas.forEach(function(m) {
      if (!m.monstros && dlc.monstros) m.monstros = Object.keys(dlc.monstros);
      dlcZones.push(m);
      if (m.y + m.h > WORLD.h) WORLD.h = m.y + m.h; 
      if (m.x + m.w > WORLD.w) WORLD.w = m.x + m.w; 
    });
  }
  spawnMonsters(); 
}

function carregarDLCsAuto() {
  fetch('dlcs/packs.json')
    .then(function(res) { 
      if(!res.ok) throw new Error('Arquivo packs.json não encontrado'); 
      return res.json(); 
    })
    .then(function(packs) {
      packs.dlcs.forEach(function(fileName) {
        fetch('dlcs/' + fileName)
          .then(function(res) { return res.json(); })
          .then(function(data) {
            instalarDLC(data);
            console.log('DLC carregada: ' + fileName);
          })
          .catch(function(e) { console.error('Erro ao ler ' + fileName, e); });
      });
    })
    .catch(function(e) { 
      console.log('Aviso: Nenhuma DLC automática encontrada. Use o Menu para importar manualmente.'); 
    });
}

function boot(){
  resize(); carregar();
  
  if(SAVE.world.customMonsters) {
    for (var mId in SAVE.world.customMonsters) MONSTERS[mId] = SAVE.world.customMonsters[mId];
  }
  
  if(SAVE.world.zones) {
    SAVE.world.zones.forEach(function(z) {
      dlcZones.push(z);
      if (z.y + z.h > WORLD.h) WORLD.h = z.y + z.h;
      if (z.x + z.w > WORLD.w) WORLD.w = z.x + z.w;
    });
  }

  var ids = Object.keys(SAVE.chars);
  if(ids.length === 0){ telaNovoHeroi(); } 
  else {
    currentId = SAVE.current && SAVE.chars[SAVE.current] ? SAVE.current : ids[0];
    G = SAVE.chars[currentId];
    if(!G.equip) G.equip = {arma:null,armadura:null,elmo:null,escudo:null,acessorio:null,botas:null};
    if(!G.quests) G.quests = {};
    if(!G.inv) G.inv = []; if(!G.banco) G.banco = [];
    G.inv = G.inv.filter(function(it){ return ITEMS[it.id]; });
    G.banco = G.banco.filter(function(it){ return ITEMS[it.id]; });
    for(var s in G.equip){ if(G.equip[s] && !ITEMS[G.equip[s]]) G.equip[s] = null; }
    spawnMonsters(); ground = []; updateSkillNames();
    toast('Bem-vindo de volta!');
  }
  
  carregarDLCsAuto();

  atualizarHUD();
  requestAnimationFrame(loop);
}
